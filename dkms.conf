# DKMS configuration for mct_t6.
#
# DKMS rebuilds the module for every installed kernel, so it keeps working
# across kernel updates on Debian/Ubuntu, Fedora and Arch alike.  See
# README.md for installation.
PACKAGE_NAME="mct-t6"
PACKAGE_VERSION="0.2.2"

BUILT_MODULE_NAME[0]="mct_t6"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/src clean"

AUTOINSTALL="yes"
